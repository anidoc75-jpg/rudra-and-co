<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RUDRA & CO. Admin</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>.admin-wrap{max-width:1100px;margin:auto;padding:25px 4%}.admin-card{background:#fff;border:1px solid #e9e0d7;padding:22px;margin:16px 0}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.admin-card input,.admin-card textarea,.admin-card select{width:100%;padding:12px;border:1px solid #ddd;margin:5px 0}.admin-card textarea{min-height:90px}.product-admin{display:grid;grid-template-columns:90px 1fr auto;gap:15px;align-items:center;border-top:1px solid #eee;padding:15px 0}.product-admin img{width:90px;height:90px;object-fit:cover;background:#eee}.danger{background:#a33!important}.small{font-size:12px;color:#756d69}@media(max-width:700px){.admin-grid{grid-template-columns:1fr}.product-admin{grid-template-columns:70px 1fr}.product-admin .actions{grid-column:1/-1}}</style></head>
<body><header class="topbar"><div class="wrap nav"><a class="brand" href="index.html"><span class="logo">R&C</span><span><b>RUDRA & CO.</b><small>ADMIN PANEL</small></span></a><a class="btn" href="index.html">Store</a></div></header>
<main class="admin-wrap">
<div id="loginBox" class="admin-card"><h1>Admin Login</h1><p class="small">Admin email: rudraveda@gmail.com</p><input id="email" type="email" value="rudraveda@gmail.com" placeholder="Email"><input id="password" type="password" placeholder="Password"><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="login()">Login</button><button class="chip" onclick="signup()">Create admin account</button></div><p id="authMsg" class="small"></p></div>
<div id="panel" style="display:none"><div class="admin-card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h1>RUDRA & CO. Admin</h1><button class="chip" onclick="logout()">Logout</button></div><p class="small">Products yahan add/edit/delete karo. Images Supabase Storage me save hongi.</p></div>
<div class="admin-card"><h2 id="formTitle">Add Product</h2><div class="admin-grid"><input id="pname" placeholder="Product name"><select id="pcat"><option>Jewellery</option><option>Baby</option></select><input id="pprice" type="number" placeholder="Selling price"><input id="pmrp" type="number" placeholder="MRP"><input id="pstock" type="number" placeholder="Stock"><input id="pimage" type="file" accept="image/*"><textarea id="pdesc" placeholder="Product description"></textarea></div><div style="display:flex;gap:10px;margin-top:10px"><button class="btn" onclick="saveProduct()">Save Product</button><button class="chip" onclick="resetForm()">Clear</button></div><input type="hidden" id="editId"></div>
<div class="admin-card"><h2>Products</h2><div id="productList"></div></div>
<div class="admin-card"><h2>Orders</h2><div id="orderList">Loading…</div></div></div></main>
<script>
const SB_URL="https://nbwurbaukbulcgddbxsl.supabase.co",SB_KEY="$sb_publishable_DY8rQblNJTQ5-AyLqLgkYg_rkpYiJ3h",db=supabase.createClient(SB_URL,SB_KEY);
const =s=>document.querySelector(s);let products=[];
function msg(t){$("#authMsg").textContent=t;}
async function login(){let email=$("#email").value.trim(),password=$("#password").value;if(email!=="rudraveda@gmail.com")return msg("Sirf owner admin email allowed hai.");let r=await db.auth.signInWithPassword({email,password});if(r.error)return msg(r.error.message);showPanel();}
async function signup(){let email=$("#email").value.trim(),password=$("#password").value;if(email!=="rudraveda@gmail.com")return msg("Owner email hi use karo.");if(password.length<6)return msg("Password kam se kam 6 characters ka rakho.");let r=await db.auth.signUp({email,password});if(r.error)return msg(r.error.message);msg("Account created. Agar email confirmation maange to email verify karke Login karo.");if(r.data.session)showPanel();}
async function logout(){await db.auth.signOut();location.reload();}
async function showPanel(){let s=await db.auth.getSession();if(!s.data.session)return;$("#loginBox").style.display="none";$("#panel").style.display="block";loadProducts();loadOrders();}
async function loadProducts(){let r=await db.from("products").select("*").order("created_at",{ascending:false});if(r.error)return alert(r.error.message);products=r.data||[];renderProducts();}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function renderProducts(){$("#productList").innerHTML=products.map(p=>`<div class="product-admin"><img src="${p.image_url||''}" alt=""><div><b>${esc(p.name)}</b><div class="small">${esc(p.category)} · ₹${p.price} · MRP ₹${p.mrp} · Stock ${p.stock} · ${p.active?"Live":"Hidden"}</div></div><div class="actions"><button class="chip" onclick="editProduct('${p.id}')">Edit</button> <button class="chip danger" onclick="deleteProduct('${p.id}')">Delete</button></div></div>`).join("")||"<p>No products.</p>";}
async function saveProduct(){let id=$("#editId").value,n=$("#pname").value.trim(),cat=$("#pcat").value,price=+$("#pprice").value,mrp=+$("#pmrp").value||price,stock=+$("#pstock").value||0,desc=$("#pdesc").value.trim(),file=$("#pimage").files[0];if(!n||!price)return alert("Name aur price required.");let image_url="",old=products.find(x=>x.id===id);if(old)image_url=old.image_url||"";if(file){let ext=file.name.split(".").pop().toLowerCase(),path=`${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;let up=await db.storage.from("products").upload(path,file,{upsert:true,contentType:file.type});if(up.error)return alert("Image upload error: "+up.error.message);image_url=db.storage.from("products").getPublicUrl(path).data.publicUrl;}let payload={name:n,category:cat,price,mrp,stock,description:desc,image_url,active:true};let r=id?await db.from("products").update(payload).eq("id",id):await db.from("products").insert(payload);if(r.error)return alert(r.error.message);resetForm();loadProducts();}
function editProduct(id){let p=products.find(x=>x.id===id);if(!p)return;$("#editId").value=p.id;$("#pname").value=p.name;$("#pcat").value=p.category;$("#pprice").value=p.price;$("#pmrp").value=p.mrp;$("#pstock").value=p.stock;$("#pdesc").value=p.description||"";$("#formTitle").textContent="Edit Product";scrollTo({top:0,behavior:"smooth"});}
async function deleteProduct(id){if(!confirm("Product delete karna hai?"))return;let r=await db.from("products").delete().eq("id",id);if(r.error)return alert(r.error.message);loadProducts();}
function resetForm(){["editId","pname","pprice","pmrp","pstock","pdesc"].forEach(id=>$("#"+id).value="");$("#pimage").value="";$("#pcat").value="Jewellery";$("#formTitle").textContent="Add Product";}
async function loadOrders(){let r=await db.from("orders").select("*").order("created_at",{ascending:false});if(r.error)return $("#orderList").textContent=r.error.message;let rows=r.data||[];$("#orderList").innerHTML=rows.map(o=>`<div class="admin-card" style="margin:10px 0"><b>${esc(o.customer_name)}</b> · ${esc(o.phone)}<div class="small">${new Date(o.created_at).toLocaleString()} · ₹${o.total} · ${esc(o.address)}</div><div class="small">${(o.items||[]).map(i=>esc(i.name)+" × "+i.qty).join(" | ")}</div><select onchange="updateOrder('${o.id}',this.value)"><option ${o.status==="Pending"?"selected":""}>Pending</option><option ${o.status==="Confirmed"?"selected":""}>Confirmed</option><option ${o.status==="Shipped"?"selected":""}>Shipped</option><option ${o.status==="Delivered"?"selected":""}>Delivered</option><option ${o.status==="Cancelled"?"selected":""}>Cancelled</option></select></div>`).join("")||"<p>No orders yet.</p>";}
async function updateOrder(id,status){let r=await db.from("orders").update({status}).eq("id",id);if(r.error)alert(r.error.message);}
db.auth.getSession().then(showPanel);
</script></body></html>
