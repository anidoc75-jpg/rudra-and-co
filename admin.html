<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RUDRA & CO. Admin</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap section"><a href="index.html">← Store</a><h1>Product Manager</h1><p class="meta">Starter admin: products are stored only in this browser. It is not a secure multi-device production admin.</p><div class="cart-box"><div class="checkout"><input id="name" placeholder="Product name"><input id="cat" placeholder="Category"><input id="price" type="number" placeholder="Selling price"><input id="mrp" type="number" placeholder="MRP"><input id="stock" type="number" placeholder="Stock"><button class="btn" onclick="addProduct()">Add product</button></div></div><div id="list" class="grid" style="margin-top:25px"></div></main><script>let ps=JSON.parse(localStorage.getItem("rudra_products")||"[]");function save(){localStorage.setItem("rudra_products",JSON.stringify(ps));render()}function addProduct(){let n=name.value.trim(),c=cat.value.trim()||"Jewellery",p=+price.value,m=+mrp.value,s=+stock.value;if(!n||!p)return alert("Name and price required.");ps.push({id:Date.now(),name:n,cat:c,price:p,mrp:m||p,stock:s||0});save()}function del(id){ps=ps.filter(x=>x.id!==id);save()}function render(){list.innerHTML=ps.map(p=>'<div class="card"><div class="info"><h3>'+p.name+'</h3><div class="meta">'+p.cat+' · Stock '+p.stock+'</div><div class="price">₹'+p.price+'</div><button class="add" onclick="del('+p.id+')">Delete</button></div></div>').join("")||'<div class="empty">No products yet.</div>'}render()</script></body></html>
